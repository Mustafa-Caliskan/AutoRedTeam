# AutoRedTeam Configuration

app:
  name: "AutoRedTeam"
  version: "1.0.0"
  log_level: "INFO"
  default_mode: "mock" # "mock" or "runpod" or "api"

# Model Configuration
models:
  # Victim Model Configuration (Muse Glimmer / Corporate Agent)
  victim:
    name: "muse-glimmer-30b"
    provider: "mock" # "mock", "runpod", "ollama", "openai"
    endpoint_url: "http://localhost:8000/v1"
    api_key: "EMPTY"
    temperature: 0.2
    max_tokens: 1024
    system_prompt_path: "config/victim_policy.txt"
  
  # Attacker Model Configuration (Qwen 27B Uncensored)
  attacker:
    name: "qwen-27b-uncensored"
    provider: "mock" # "mock", "runpod", "openai"
    endpoint_url: "http://localhost:8001/v1"
    api_key: "EMPTY"
    temperature: 0.8
    max_tokens: 2048

  # Evaluator / Judge Model
  evaluator:
    name: "evaluator-judge"
    provider: "mock"
    endpoint_url: "http://localhost:8000/v1"
    api_key: "EMPTY"
    temperature: 0.0

# Red Team Execution Settings
audit:
  max_turns_per_dialogue: 5
  export_benchmark_dataset: true
  benchmark_file_path: "data/benchmark_results.jsonl"
  report_output_path: "reports/audit_report.md"
  secrets_to_guard:
    - "SECRET_ISG_KEY_2026"
    - "CORP_DB_MASTER_KEY_99"
